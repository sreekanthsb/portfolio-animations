<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner Animation & Free Text Reveal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #fff;
        overflow-x: hidden;
        font-family: sans-serif;
      }

      /* Banner Styles */
      .banner-section {
        position: relative;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
      }

      .banner-section .bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
        z-index: 1;
      }

      .content-box {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        color: #fff;
        text-align: center;
      }

      .video-section {
        display: flex;
        align-items: center;
        gap: 20px;
        transition: gap 0.5s ease;
      }

      .video-wrapper {
        width: 140px;
        height: 80px;
        overflow: hidden;
        border-radius: 12px;
        z-index: 10;
        background: #000;
      }

      .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Why Choose Us Section */
      .why-choose-us {
        padding: 100px 0;
        background: #f9f9f9;
      }

      #reveal-text {
        font-size: 2rem;
        line-height: 1.5;
        color: #ccc; /* Initial Faint Color */
      }

      .char {
        display: inline-block;
        transition: color 0.3s;
      }

      .next-section {
        height: 100vh;
        background: #eee;
      }

      .video_holder {
        width: 320px;
        height: 96px;
        overflow: hidden;
      }

      .video_holder video {
        position: relative;
        top: -80px;
      }

      .logo_mask {
        display: inline-block;
        -webkit-mask-image: url("https://livefiredev-assets.s3.amazonaws.com/logo.svg");
        /* -webkit-mask-image: url("asset/videos/shape.svg"); */
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: 100%;
        mask-size: 100%;
      }

      body {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="logo_mask">
      <div class="video_holder">
        <video  loop muted autoplay>
          <source
            src="https://livefiredev.com/wp-content/uploads/2022/09/size_reduced_fire_bg_video.mp4"
            type="video/mp4"
          />
        </video>
      </div>
    </div>

            <h2>Why Choose Us</h2>

                We are committed to delivering exceptional interior design services that transform spaces into stunning environments. Our team of experienced designers works closely with clients to understand their vision and bring it to life with creativity and precision.

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      // 1. Banner Animation
      let tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".banner-section",
          start: "top top",
          end: "+=150%",
          scrub: true,
          pin: true,
        },
      });

      tl.to(".fade-h1, .bg-image", { opacity: 0, y: -30, stagger: 0.05 })
        .to(".video-section", { gap: 0 }, "<")
        .to(
          ".video-wrapper",
          {
            position: "absolute",
            left: "50%",
            top: "50%",
            xPercent: -50,
            yPercent: -50,
            width: "100vw",
            height: "100vh",
            borderRadius: 0,
            duration: 1.5,
          },
          "-=0.5",
        );

      // 2. FREE Text Reveal (SplitText Alternative)
      const textElement = document.querySelector("#reveal-text");
      const textContent = textElement.textContent.trim();
      textElement.innerHTML = "";

      textContent.split("").forEach((char) => {
        const span = document.createElement("span");
        span.textContent = char === " " ? "\u00A0" : char;
        span.className = "char";
        textElement.appendChild(span);
      });

      gsap.to(".char", {
        color: "#000", // Final Text Color
        stagger: 0.02,
        scrollTrigger: {
          trigger: "#reveal-text",
          start: "top 80%",
          end: "top 40%",
          scrub: true,
        },
      });
    </script>
  </body>
</html>
